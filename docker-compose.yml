services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall}
      POSTGRES_DB: ${POSTGRES_DB:-recall}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Inside the compose network the DB host is the service name "db".
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recall}:${POSTGRES_PASSWORD:-recall}@db:5432/${POSTGRES_DB:-recall}
      # Hugging Face model cache on a named volume: the embedding model downloads once.
      HF_HOME: /hf-cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Dev: mount source and auto-reload. Only source dirs are mounted so the
    # image's Linux .venv is never shadowed by a host (e.g. Windows) .venv.
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - hf_cache:/hf-cache
      # Snowflake key pair (git-ignored); read-only inside the container.
      - ./secrets:/app/secrets:ro
    command: sh -c "alembic upgrade head && python -m app.datasets.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  pgdata:
  hf_cache:
